<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光陰與金 - Google Drive 雙端同步完整版</title>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { 
            --primary-color: #800020; 
            --primary-hover: #5d0017; 
            --primary-light: #fdf2f4; 
            --bg-color: #fcf9f9; 
            --card-bg: #ffffff; 
            --text-color: #2b2627; 
            --text-muted: #6e6567; 
            --border-color: #f0e6e8; 
            --danger-color: #dc2626; 
            --shadow-md: 0 10px 25px -5px rgba(128, 0, 32, 0.08); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 24px 16px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .card { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
        .full-width { grid-column: 1 / -1; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .sync-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; background: #e0f2fe; color: #0369a1; font-weight: 600; }
        h2 { font-size: 1.2rem; color: var(--primary-color); display: flex; align-items: center; justify-content: space-between; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-header button { background: var(--primary-light); color: var(--primary-color); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .calendar-day-head { font-weight: 600; padding: 8px 0; color: var(--text-muted); font-size: 0.85rem; }
        .calendar-day { padding: 12px 0; border-radius: 10px; cursor: pointer; font-size: 0.95rem; position: relative; font-weight: 500; }
        .calendar-day:hover:not(.empty) { background-color: var(--primary-light); }
        .calendar-day.selected { background-color: var(--primary-color); color: white; }
        .calendar-day.empty { cursor: default; }
        .dot-container { display: flex; justify-content: center; gap: 3px; position: absolute; bottom: 4px; left: 0; right: 0; }
        .dot { width: 4px; height: 4px; border-radius: 50%; }
        .dot-schedule { background-color: var(--primary-color); }
        .selected .dot-schedule { background-color: #fff; }
        .dot-expense { background-color: #d97706; }

        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; background: var(--primary-light); padding: 12px; border-radius: 12px; }
        .form-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        input, select, button { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.88rem; outline: none; }
        input[type="text"], input[type="number"] { flex: 1; }
        button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background-color: var(--primary-hover); }
        button.danger { background-color: #fee2e2; color: var(--danger-color); padding: 4px 8px; font-size: 0.75rem; }
        button.action-btn { background-color: #f3f4f6; color: #374151; padding: 4px 8px; font-size: 0.75rem; border: 1px solid #d1d5db; }
        
        .item-list { list-style: none; max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .item-card { background: #fff; border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
        .item-details { display: flex; flex-direction: column; gap: 4px; }
        .item-time { color: var(--primary-color); font-weight: 600; font-size: 0.85rem; }
        .item-title { font-weight: 600; font-size: 0.95rem; }
        .item-sub { font-size: 0.8rem; color: var(--text-muted); }
        .item-actions { display: flex; gap: 4px; }
        .amount-expense { color: var(--danger-color); font-weight: 700; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card full-width">
        <div class="top-bar">
            <h2>📅 記事與記帳日曆</h2>
            <div>
                <button id="login-btn" onclick="requestDriveAccess()">🔗 登入 Google 同步雲端</button>
                <div id="user-section" class="user-info" style="display: none;">
                    <span id="sync-status" class="sync-badge">未同步</span>
                    <button onclick="syncFromDrive()" class="action-btn">手動同步</button>
                    <button onclick="logoutGoogle()" class="danger">登出</button>
                </div>
            </div>
        </div>

        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&lt; 上個月</button>
            <h2 id="month-year-display"></h2>
            <button onclick="changeMonth(1)">下個月 &gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <!-- 行程管理區塊 -->
    <div class="card">
        <h2>📅 行程管理</h2>
        <div class="form-group">
            <div class="form-row">
                <label style="font-size: 0.8rem;">時間：</label>
                <input type="time" id="sch-start" value="09:00">
                <span>至</span>
                <input type="time" id="sch-end" value="10:00">
            </div>
            <div class="form-row">
                <input type="text" id="sch-title" placeholder="行程名稱（必填）">
            </div>
            <div class="form-row">
                <input type="text" id="sch-location" placeholder="地點（選填）">
                <select id="sch-reminder">
                    <option value="none">不提醒</option>
                    <option value="at_time">準時提醒</option>
                </select>
                <button onclick="addSchedule()">新增</button>
            </div>
        </div>
        <ul class="item-list" id="sch-list"></ul>
    </div>

    <!-- 記帳管理區塊 -->
    <div class="card">
        <h2>💰 記帳管理</h2>
        <div class="form-group">
            <div class="form-row">
                <input type="number" id="exp-amount" placeholder="金額 ($)" style="width: 100px;">
                <input type="text" id="exp-note" placeholder="備註（例：晚餐）">
                <button onclick="addExpense()">紀錄</button>
            </div>
        </div>
        <ul class="item-list" id="exp-list"></ul>
    </div>
</div>

<script>
    const CLIENT_ID = '690512017883-0j2kk3tk1viomcqor8i88n2vmqs0jsqv.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
    const FILE_NAME = 'time_money_backup.json';

    let tokenClient;
    let accessToken = null;
    let driveFileId = null;

    let currentDate = new Date();
    let selectedDateStr = formatDate(new Date());
    let db = JSON.parse(localStorage.getItem('my_calendar_db')) || { schedules: {}, expenses: {} };

    function formatDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    // --- Google Drive 認證與授權 ---
    function initGoogleAuth() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: async (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                    accessToken = tokenResponse.access_token;
                    updateUIStatus(true);
                    await syncFromDrive();
                }
            },
        });
    }

    function requestDriveAccess() {
        if (!tokenClient) initGoogleAuth();
        tokenClient.requestAccessToken({ prompt: '' });
    }

    function logoutGoogle() {
        accessToken = null;
        driveFileId = null;
        updateUIStatus(false);
    }

    function updateUIStatus(isLoggedIn) {
        document.getElementById('login-btn').style.display = isLoggedIn ? 'none' : 'block';
        document.getElementById('user-section').style.display = isLoggedIn ? 'flex' : 'none';
    }

    // --- 雲端 API 自動讀寫核心 ---
    async function findDriveFile() {
        if (!accessToken) return null;
        try {
            const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${FILE_NAME}'`, {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (res.status === 401) {
                requestDriveAccess();
                return null;
            }
            const data = await res.json();
            if (data.files && data.files.length > 0) {
                driveFileId = data.files[0].id;
                return driveFileId;
            }
        } catch (e) {
            console.error('尋找備份檔失敗:', e);
        }
        return null;
    }

    async function syncFromDrive() {
        if (!accessToken) return;
        document.getElementById('sync-status').innerText = '同步中...';
        try {
            let fileId = await findDriveFile();
            if (fileId) {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const cloudData = await res.json();
                if (cloudData) {
                    db = cloudData;
                    localStorage.setItem('my_calendar_db', JSON.stringify(db));
                    renderCalendar();
                    renderSchedules();
                    renderExpenses();
                }
            }
            document.getElementById('sync-status').innerText = '已同步';
        } catch (e) {
            console.error('從雲端下載失敗:', e);
            document.getElementById('sync-status').innerText = '同步失敗';
        }
    }

    async function syncToDrive() {
        localStorage.setItem('my_calendar_db', JSON.stringify(db));
        renderCalendar();
        renderSchedules();
        renderExpenses();

        if (!accessToken) return;
        document.getElementById('sync-status').innerText = '上傳中...';

        try {
            if (!driveFileId) await findDriveFile();

            const metadata = { name: FILE_NAME, parents: ['appDataFolder'] };
            const formData = new FormData();
            formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            formData.append('file', new Blob([JSON.stringify(db)], { type: 'application/json' }));

            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            let method = 'POST';

            if (driveFileId) {
                url = `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`;
                method = 'PATCH';
            }

            const res = await fetch(url, {
                method: method,
                headers: { 'Authorization': `Bearer ${accessToken}` },
                body: formData
            });

            if (res.status === 401) {
                requestDriveAccess();
                return;
            }

            const result = await res.json();
            if (result.id) driveFileId = result.id;
            document.getElementById('sync-status').innerText = '已同步';
        } catch (e) {
            console.error('上傳雲端失敗:', e);
            document.getElementById('sync-status').innerText = '上傳失敗';
        }
    }

    // --- 日曆與介面渲染邏輯 ---
    window.onload = () => {
        initGoogleAuth();
        renderCalendar();
        renderSchedules();
        renderExpenses();
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }
    };

    // 自動拉取：切換回頁面時主動更新
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && accessToken) {
            syncFromDrive();
        }
    });

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        document.getElementById('month-year-display').innerText = `${year}年 ${month + 1}月`;
        
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        ['日', '一', '二', '三', '四', '五', '六'].forEach(d => grid.innerHTML += `<div class="calendar-day-head">${d}</div>`);

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="calendar-day empty"></div>`;

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const isSelected = dateStr === selectedDateStr ? 'selected' : '';
            const hasSchedule = db.schedules[dateStr]?.length > 0;
            const hasExpense = db.expenses[dateStr]?.length > 0;

            let dots = '<div class="dot-container">';
            if (hasSchedule) dots += '<span class="dot dot-schedule"></span>';
            if (hasExpense) dots += '<span class="dot dot-expense"></span>';
            dots += '</div>';

            grid.innerHTML += `<div class="calendar-day ${isSelected}" onclick="selectDate('${dateStr}')">${day}${dots}</div>`;
        }
    }

    function selectDate(dateStr) {
        selectedDateStr = dateStr;
        renderCalendar();
        renderSchedules();
        renderExpenses();
    }

    // --- 行程功能 ---
    function addSchedule() {
        const title = document.getElementById('sch-title').value.trim();
        const startTime = document.getElementById('sch-start').value;
        const endTime = document.getElementById('sch-end').value;
        const location = document.getElementById('sch-location').value.trim();
        const reminder = document.getElementById('sch-reminder').value;

        if (!title) return alert('請輸入行程名稱');

        if (!db.schedules[selectedDateStr]) db.schedules[selectedDateStr] = [];
        db.schedules[selectedDateStr].push({ id: Date.now(), startTime, endTime, title, location, reminder });

        document.getElementById('sch-title').value = '';
        document.getElementById('sch-location').value = '';
        syncToDrive();
    }

    function copySchedule(id) {
        const item = db.schedules[selectedDateStr].find(s => s.id === id);
        if (!item) return;
        const targetDate = prompt("請輸入要複製到的日期 (格式: YYYY-MM-DD):", selectedDateStr);
        if (targetDate) {
            if (!db.schedules[targetDate]) db.schedules[targetDate] = [];
            db.schedules[targetDate].push({ ...item, id: Date.now() });
            syncToDrive();
        }
    }

    function deleteSchedule(id) {
        db.schedules[selectedDateStr] = db.schedules[selectedDateStr].filter(item => item.id !== id);
        syncToDrive();
    }

    function renderSchedules() {
        const list = document.getElementById('sch-list');
        list.innerHTML = '';
        const items = db.schedules[selectedDateStr] || [];
        if (!items.length) return list.innerHTML = '<li style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding:12px;">本日無行程</li>';
        
        items.forEach(item => {
            const locText = item.location ? `📍 ${item.location}` : '';
            list.innerHTML += `
                <li class="item-card">
                    <div class="item-details">
                        <span class="item-time">⏱️ ${item.startTime} - ${item.endTime}</span>
                        <span class="item-title">${item.title}</span>
                        <span class="item-sub">${locText}</span>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn" onclick="copySchedule(${item.id})">複製</button>
                        <button class="danger" onclick="deleteSchedule(${item.id})">刪除</button>
                    </div>
                </li>`;
        });
    }

    // --- 記帳功能 ---
    function addExpense() {
        const amount = parseFloat(document.getElementById('exp-amount').value);
        const note = document.getElementById('exp-note').value.trim();
        if (isNaN(amount)) return alert('請輸入金額');

        if (!db.expenses[selectedDateStr]) db.expenses[selectedDateStr] = [];
        db.expenses[selectedDateStr].push({ id: Date.now(), amount, note: note || '支出' });

        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-note').value = '';
        syncToDrive();
    }

    function deleteExpense(id) {
        db.expenses[selectedDateStr] = db.expenses[selectedDateStr].filter(item => item.id !== id);
        syncToDrive();
    }

    function renderExpenses() {
        const list = document.getElementById('exp-list');
        list.innerHTML = '';
        const items = db.expenses[selectedDateStr] || [];
        if (!items.length) return list.innerHTML = '<li style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding:12px;">本日無記帳紀錄</li>';
        
        items.forEach(item => {
            list.innerHTML += `
                <li class="item-card">
                    <div class="item-details"><span class="item-title">${item.note}</span></div>
                    <div class="item-actions" style="align-items: center; gap: 10px;">
                        <span class="amount-expense">-$${item.amount}</span>
                        <button class="danger" onclick="deleteExpense(${item.id})">刪除</button>
                    </div>
                </li>`;
        });
    }

    function changeMonth(delta) { 
        currentDate.setMonth(currentDate.getMonth() + delta); 
        renderCalendar(); 
    }
</script>

</body>
</html>
