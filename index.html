<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光陰與金 - Supabase 雲端同步版</title>
    <!-- 引入 Supabase JS Client (最新 v2 穩定版) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root { 
            --primary-color: #800020; 
            --primary-hover: #5d0017; 
            --primary-light: #fdf2f4; 
            --bg-color: #fcf9f9; 
            --card-bg: #ffffff; 
            --text-color: #2b2627; 
            --text-muted: #6e6567; 
            --border-color: #f0e6e8; 
            --danger-color: #dc2626; 
            --success-color: #16a34a; 
            --shadow-md: 0 10px 25px -5px rgba(128, 0, 32, 0.08); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 24px 16px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .card { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
        .full-width { grid-column: 1 / -1; }
        h2 { font-size: 1.2rem; margin-bottom: 18px; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-header button { background: var(--primary-light); color: var(--primary-color); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .calendar-day-head { font-weight: 600; padding: 8px 0; color: var(--text-muted); font-size: 0.85rem; }
        .calendar-day { padding: 12px 0; border-radius: 10px; cursor: pointer; font-size: 0.95rem; position: relative; font-weight: 500; }
        .calendar-day:hover:not(.empty) { background-color: var(--primary-light); }
        .calendar-day.selected { background-color: var(--primary-color); color: white; }
        .calendar-day.empty { cursor: default; }
        .dot-container { display: flex; justify-content: center; gap: 3px; position: absolute; bottom: 4px; left: 0; right: 0; }
        .dot { width: 4px; height: 4px; border-radius: 50%; }
        .dot-schedule { background-color: var(--primary-color); }
        .selected .dot-schedule { background-color: #fff; }
        .dot-expense { background-color: #d97706; }
        .form-group { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        input, select, button { padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; outline: none; }
        button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background-color: var(--primary-hover); }
        button.danger { background-color: #fee2e2; color: var(--danger-color); padding: 5px 10px; font-size: 0.8rem; }
        .item-list { list-style: none; max-height: 320px; overflow-y: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .item-time { color: var(--primary-color); font-weight: 600; margin-right: 8px; }
        .amount-expense { color: var(--danger-color); font-weight: 700; }
        .status-tag { font-size: 0.8rem; padding: 2px 8px; border-radius: 12px; font-weight: normal; }
        .status-online { background: #dcfce7; color: #15803d; }
        .status-offline { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <div class="card full-width">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&lt; 上個月</button>
            <h2>
                <span id="month-year-display"></span>
                <span id="sync-status" class="status-tag status-offline">連線中...</span>
            </h2>
            <button onclick="changeMonth(1)">下個月 &gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <div class="card">
        <h2>📅 雲端行程</h2>
        <div class="form-group">
            <input type="time" id="sch-time" value="09:00">
            <input type="text" id="sch-title" placeholder="行程名稱" style="flex:1;">
            <button onclick="addSchedule()">新增</button>
        </div>
        <ul class="item-list" id="sch-list"></ul>
    </div>

    <div class="card">
        <h2>💰 雲端記帳</h2>
        <div class="form-group">
            <input type="number" id="exp-amount" placeholder="金額" style="width:100px;">
            <input type="text" id="exp-note" placeholder="備註" style="flex:1;">
            <button onclick="addExpense()">紀錄</button>
        </div>
        <ul class="item-list" id="exp-list"></ul>
    </div>
</div>

<script>
    // ⬇️ 請在下方單引號內填入你的 Data API 網址與 Publishable Key ⬇️
    const SUPABASE_URL = 'https://cffqcybqnpfnaoaqpikf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_DWBtSFdn51x6UymNiQb5hw_pspRf6f5'; // 貼上剛複製的 Publishable Key
    
    let supabaseClient = null;
    let currentDate = new Date();
    let selectedDateStr = formatDate(new Date());
    let db = { schedules: {}, expenses: {} };

    function formatDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function initSupabase() {
        if (SUPABASE_URL.includes('YOUR_PROJECT_ID') || !SUPABASE_KEY.startsWith('sb_publishable')) {
            updateStatus(false, '尚未填入 Key');
            return false;
        }
        try {
            // 初始化 Supabase 客戶端
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            return true;
        } catch (err) {
            console.error('Supabase 初始化失敗:', err);
            updateStatus(false, '初始化失敗');
            return false;
        }
    }

    function updateStatus(isOnline, text) {
        const tag = document.getElementById('sync-status');
        if (isOnline) {
            tag.className = 'status-tag status-online';
            tag.innerText = text || '雲端已同步';
        } else {
            tag.className = 'status-tag status-offline';
            tag.innerText = text || '未連線';
        }
    }

    async function loadCloudData() {
        if (!supabaseClient && !initSupabase()) return;

        try {
            const { data: schedules, error: schError } = await supabaseClient.from('schedules').select('*');
            const { data: expenses, error: expError } = await supabaseClient.from('expenses').select('*');

            if (schError || expError) {
                console.error(schError || expError);
                updateStatus(false, '資料同步失敗');
                return;
            }

            db.schedules = {};
            db.expenses = {};

            if (schedules) {
                schedules.forEach(item => {
                    if (!db.schedules[item.date]) db.schedules[item.date] = [];
                    db.schedules[item.date].push({
                        id: item.id, startTime: item.start_time, endTime: item.end_time,
                        title: item.title, location: item.location, reminder: item.reminder
                    });
                });
            }

            if (expenses) {
                expenses.forEach(item => {
                    if (!db.expenses[item.date]) db.expenses[item.date] = [];
                    db.expenses[item.date].push({
                        id: item.id, time: item.time, type: item.type,
                        amount: parseFloat(item.amount), note: item.note
                    });
                });
            }

            updateStatus(true);
            renderCalendar();
            renderSchedules();
            renderExpenses();
        } catch (err) {
            console.error(err);
            updateStatus(false, '連線異常');
        }
    }

    window.onload = () => {
        renderCalendar();
        loadCloudData();
    };

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        document.getElementById('month-year-display').innerText = `${year}年 ${month + 1}月`;
        
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        ['日', '一', '二', '三', '四', '五', '六'].forEach(d => grid.innerHTML += `<div class="calendar-day-head">${d}</div>`);

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="calendar-day empty"></div>`;

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const isSelected = dateStr === selectedDateStr ? 'selected' : '';
            const hasSchedule = db.schedules[dateStr]?.length > 0;
            const hasExpense = db.expenses[dateStr]?.length > 0;

            let dots = '<div class="dot-container">';
            if (hasSchedule) dots += '<span class="dot dot-schedule"></span>';
            if (hasExpense) dots += '<span class="dot dot-expense"></span>';
            dots += '</div>';

            grid.innerHTML += `<div class="calendar-day ${isSelected}" onclick="selectDate('${dateStr}')">${day}${dots}</div>`;
        }
    }

    function selectDate(dateStr) {
        selectedDateStr = dateStr;
        renderCalendar();
        renderSchedules();
        renderExpenses();
    }

    async function addSchedule() {
        if (!supabaseClient) return alert('請先設定 API 連線');
        const title = document.getElementById('sch-title').value.trim();
        const startTime = document.getElementById('sch-time').value;
        if (!title || !startTime) return alert('請輸入時間與標題');

        const newItem = { id: Date.now(), date: selectedDateStr, start_time: startTime, title: title };
        const { error } = await supabaseClient.from('schedules').insert([newItem]);
        
        if (error) {
            alert('新增失敗：' + error.message);
        } else {
            document.getElementById('sch-title').value = '';
            loadCloudData();
        }
    }

    async function deleteSchedule(id) {
        if (!supabaseClient) return;
        const { error } = await supabaseClient.from('schedules').delete().eq('id', id);
        if (error) alert('刪除失敗：' + error.message);
        else loadCloudData();
    }

    function renderSchedules() {
        const list = document.getElementById('sch-list');
        list.innerHTML = '';
        const items = db.schedules[selectedDateStr] || [];
        if (!items.length) return list.innerHTML = '<li class="item-row">無行程</li>';
        items.forEach(item => {
            list.innerHTML += `<li class="item-row"><span><span class="item-time">${item.startTime}</span>${item.title}</span><button class="danger" onclick="deleteSchedule(${item.id})">刪除</button></li>`;
        });
    }

    async function addExpense() {
        if (!supabaseClient) return alert('請先設定 API 連線');
        const amount = parseFloat(document.getElementById('exp-amount').value);
        const note = document.getElementById('exp-note').value.trim();
        if (isNaN(amount)) return alert('請輸入金額');

        const newItem = { id: Date.now(), date: selectedDateStr, time: '12:00', type: 'expense', amount, note: note || '支出' };
        const { error } = await supabaseClient.from('expenses').insert([newItem]);

        if (error) {
            alert('新增失敗：' + error.message);
        } else {
            document.getElementById('exp-amount').value = '';
            document.getElementById('exp-note').value = '';
            loadCloudData();
        }
    }

    async function deleteExpense(id) {
        if (!supabaseClient) return;
        const { error } = await supabaseClient.from('expenses').delete().eq('id', id);
        if (error) alert('刪除失敗：' + error.message);
        else loadCloudData();
    }

    function renderExpenses() {
        const list = document.getElementById('exp-list');
        list.innerHTML = '';
        const items = db.expenses[selectedDateStr] || [];
        if (!items.length) return list.innerHTML = '<li class="item-row">無記帳</li>';
        items.forEach(item => {
            list.innerHTML += `<li class="item-row"><span>${item.note}</span><div><span class="amount-expense">-$${item.amount}</span> <button class="danger" onclick="deleteExpense(${item.id})">刪除</button></div></li>`;
        });
    }

    function changeMonth(delta) { 
        currentDate.setMonth(currentDate.getMonth() + delta); 
        renderCalendar(); 
    }
</script>

</body>
</html>
</body>
</html>
